# The settings of the SC:R mod's LAN lobby (LanLobby).
# joinVersion: the lobby protocol version a host requires in the joined-game command, a 16-bit number (decimal or 0x hexadecimal).
# Native SC:R uses 5; a host refuses a joiner with another version.
# SC:R Crossover has its own version: LAN hosts of the SC:R mod (and of native SC:R) refuse its joiners, and its hosts refuse theirs. Another
# clone that picks the same number sees its LAN games. The number changes whenever its added units or their values change, so players of
# jars with other units cannot meet in one game.
joinVersion=0xD005
